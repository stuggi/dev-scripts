networkConfig:
  interfaces:
  - name: enp6s0.99
    type: vlan
    state: up
    vlan:
      id: 99
      base-iface: enp6s0
    ipv4:
      address:
      - ip: "192.168.111.110"
        prefix-length: 24
      enabled: true
  dns-resolver:
    config:
      server:
      - 192.168.111.1
  routes:
    config:
    - destination: 0.0.0.0/0
      next-hop-address: 192.168.111.1
      next-hop-interface: enp6s0.99
